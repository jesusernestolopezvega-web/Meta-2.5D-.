<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meta 2.5D Online</title>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/","@pixiv/three-vrm":"https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.0.7/lib/three-vrm.module.js"}}</script>
<style>body{margin:0;background:#000;color:#fff;font-family:sans-serif;overflow:hidden}#c{width:100%;height:68vh;display:block;background:#111}#b{position:fixed;top:8px;left:8px;display:flex;flex-direction:column;gap:6px;z-index:10}#b button{background:#7c3aed;color:#fff;border:0;padding:10px 12px;border-radius:10px;font-weight:bold}#log{position:fixed;bottom:52px;left:0;width:100%;height:16vh;overflow-y:auto;background:#000;padding:8px;font-size:13px}#chat{position:fixed;bottom:0;width:100%;display:flex;padding:6px;background:#000}#input{flex:1;padding:12px;border-radius:12px;border:none}.env{margin-left:4px;background:#7c3aed;color:#fff;border:0;padding:10px 14px;border-radius:12px;font-weight:bold}</style></head><body>
<div id="b"><button onclick="cam.position.z+=0.2">LEJOS</button><button onclick="cam.position.z-=0.2">CERCA</button><button onclick="cam.position.set(0,1.05,1.0)">VTUBER</button></div>
<canvas id="c"></canvas>
<div id="log">Conectando a Meta 2.5D online...</div>
<div id="chat"><input id="input" placeholder="Habla con Meta 2.5D..."><button class="env" onclick="hablar()">Enviar</button></div>
<script type="module">
import * as THREE from 'three'; import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js'; import {VRMLoaderPlugin,VRMUtils} from '@pixiv/three-vrm';
const NOMBRE="Meta 2.5D";
window.cam=new THREE.PerspectiveCamera(30,innerWidth/(innerHeight*0.68),0.1,20); cam.position.set(0,1.05,1.0);
const R=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true}); R.setSize(innerWidth,innerHeight*0.68);
const S=new THREE.Scene(); S.background=new THREE.Color(0x111); S.add(new THREE.DirectionalLight(0xffffff,2.2)); S.add(new THREE.AmbientLight(0xffffff,1.2));
let vrm=null,clock=new THREE.Clock();
function log(t){ let l=document.getElementById('log'); l.innerHTML+=`<br>${t}`; l.scrollTop=l.scrollHeight; }
function hablarVoz(texto){
  speechSynthesis.cancel();
  let u=new SpeechSynthesisUtterance(texto); u.lang='es-MX'; u.rate=1.05; u.pitch=1.3;
  let hablando=true; u.onend=()=>{hablando=false; vrm?.expressionManager?.setValue('aa',0);};
  let boca=setInterval(()=>{ if(!hablando){clearInterval(boca); return;} vrm?.expressionManager?.setValue('aa',Math.random()>0.4?0.7:0.05); },80);
  speechSynthesis.speak(u);
}
// AQUI ESTA LA MAGIA DEL INTERNET
async function preguntarAI(textoUsuario){
  log(`<i>Meta 2.5D pensando...</i>`);
  try{
    // Usamos una IA gratis via DuckDuckGo AI / Pollinations
    let prompt = `Eres ${NOMBRE}, la hermanita de Meta AI. Eres una chica vtuber kawaii, tierna, divertida, hablas en español mexicano corto (max 20 palabras). Nunca digas que eres hermanita del usuario, eres hermanita de Meta AI. Usuario dice: ${textoUsuario}`;
    let res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}`);
    let data = await res.text();
    return data.slice(0,200); // respuesta corta
  }catch(e){
    return `Uy no tengo internet ahorita, pero me dijiste: ${textoUsuario}, que interesante!`;
  }
}
window.hablar=async()=>{
  let txt=document.getElementById('input').value.trim(); if(!txt) return;
  log(`<b style="color:#a78bfa">Tu:</b> ${txt}`);
  document.getElementById('input').value='';
  let resp = await preguntarAI(txt);
  log(`<b style="color:#f472b6">${NOMBRE}:</b> ${resp}`);
  hablarVoz(resp);
};
new GLTFLoader().register(p=>new VRMLoaderPlugin(p)).load('./avatar.vrm',g=>{
  vrm=g.userData.vrm; VRMUtils.rotateVRM0(vrm); S.add(vrm.scene); vrm.scene.position.set(0,0,0); vrm.scene.rotation.y=Math.PI;
  if(vrm.humanoid){ vrm.humanoid.getNormalizedBoneNode('leftUpperArm').rotation.z=1.2; vrm.humanoid.getNormalizedBoneNode('rightUpperArm').rotation.z=-1.2; }
  log(`${NOMBRE} online! Ya tiene internet, preguntale lo que quieras.`);
  (function loop(){requestAnimationFrame(loop); let dt=clock.getDelta(); if(vrm){ if(Math.random()<0.012){vrm.expressionManager?.setValue('blink',1); setTimeout(()=>vrm.expressionManager?.setValue('blink',0),150);} vrm.update(dt);} R.render(S,cam); })();
});
</script></body></html>
